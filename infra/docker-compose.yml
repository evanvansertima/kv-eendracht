# KV Eendracht — development stack.
#
# Production applies docker-compose.prod.yml as an overlay, which adds Caddy and the
# backup sidecar and drops the development-only services. See docs/Architecture/INFRA.md.
#
#   docker compose -f infra/docker-compose.yml up -d

name: kv-eendracht

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kv_eendracht}
      POSTGRES_USER: ${POSTGRES_USER:-kv_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      # nl-NL collation so ORDER BY on player names sorts the way the club expects.
      LANG: nl_NL.utf8
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=nl-NL'
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Names the database and user explicitly: during first boot the entrypoint runs a
      # temporary server for the init scripts, and a bare pg_isready reports ready against
      # it, letting dependants start against a database that is not finished yet.
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-kv_owner} -d ${POSTGRES_DB:-kv_eendracht}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Creates the three buckets from KV-EENDRACHT-APP-SPEC §8, then exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c "
      mc alias set kv http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb --ignore-existing kv/media kv/news kv/avatars;
      mc anonymous set download kv/media;
      mc anonymous set download kv/news;
      mc anonymous set download kv/avatars;
      echo 'buckets ready';
      "
    restart: 'no'

  # Captures outbound mail so password reset is testable without a real relay.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # Ad-hoc SQL, replacing Supabase Studio.
  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - '${ADMINER_PORT:-8080}:8080'
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
